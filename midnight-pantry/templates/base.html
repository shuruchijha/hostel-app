<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Midnight Pantry{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="moon">🌙</span> Midnight Pantry</a>
    {% if me %}
      <div class="who">
        <span class="who-name">{{ me.name.split()[0] }}</span>
        <a class="logout" href="{{ url_for('logout') }}">Log out</a>
      </div>
    {% endif %}
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">Out of something at 1 AM? Someone nearby probably has it. 🌙</footer>
</body>
</html>
