<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132d"/>
      <stop offset="50%" stop-color="#0f0c1d"/>
      <stop offset="100%" stop-color="#07050e"/>
    </linearGradient>

    <!-- Golden Moon & Ambient Glow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="35%" stop-color="#FFB300"/>
      <stop offset="80%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Warm Amber Glow Gradient -->
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Violet Accent Glow -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="6" y="6" width="188" height="188" rx="46" fill="url(#bgGrad)" stroke="rgba(255, 215, 100, 0.18)" stroke-width="2.5"/>

  <!-- Subtle Ambient Glow inside Icon -->
  <circle cx="100" cy="100" r="75" fill="#FFB300" opacity="0.08" filter="blur(20px)"/>

  <!-- ─── Crescent Moon ─── -->
  <path d="M 124 32 
           C 72 34 32 76 32 128 
           C 32 154 42 168 54 176 
           C 40 156 38 120 58 90 
           C 78 60 110 46 138 48 
           C 134 42 129 36 124 32 Z" 
        fill="url(#goldGrad)" 
        filter="url(#moonGlow)"/>

  <!-- ─── Modern Minimalist Pantry / Shelf Structure ─── -->
  <g transform="translate(18, 6)">
    <!-- Pantry Cabinet Outline (Slim architectural frame) -->
    <rect x="76" y="64" width="68" height="88" rx="10" 
          fill="rgba(255, 255, 255, 0.04)" 
          stroke="url(#shelfGrad)" 
          stroke-width="3" 
          stroke-dasharray="0"/>

    <!-- Middle Shelf Divider -->
    <line x1="76" y1="108" x2="144" y2="108" 
          stroke="url(#shelfGrad)" 
          stroke-width="3" 
          stroke-linecap="round"/>

    <!-- Top Shelf Item: Steaming Late-Night Noodle Bowl -->
    <!-- Bowl -->
    <path d="M 88 94 C 88 103 108 103 108 94 Z" fill="url(#goldGrad)"/>
    <!-- Steam Curls -->
    <path d="M 94 88 Q 92 82 96 78" stroke="#FFE082" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 101 89 Q 104 83 101 79" stroke="#FFE082" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Top Shelf Item: Mini Essential Pill/Care Capsule -->
    <rect x="119" y="82" width="14" height="20" rx="7" fill="url(#accentGrad)"/>
    <line x1="119" y1="92" x2="133" y2="92" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

    <!-- Bottom Shelf: Care & Sharing Essentials Box -->
    <rect x="88" y="118" width="44" height="26" rx="5" 
          fill="rgba(255, 179, 0, 0.15)" 
          stroke="url(#goldGrad)" 
          stroke-width="2"/>
    <!-- Gift / Pantry Box Ribbon Cross -->
    <line x1="110" y1="118" x2="110" y2="144" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="88" y1="131" x2="132" y2="131" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>

  <!-- ─── Sparkling Midnight Stars ─── -->
  <!-- Star 1 (Top Right Primary) -->
  <path d="M 152 46 Q 152 56 162 56 Q 152 56 152 66 Q 152 56 142 56 Q 152 56 152 46 Z" 
        fill="#FFE57F" 
        filter="url(#starGlow)"/>

  <!-- Star 2 (Small Accent) -->
  <path d="M 168 84 Q 168 89 173 89 Q 168 89 168 94 Q 168 89 163 89 Q 168 89 168 84 Z" 
        fill="#FFD54F" 
        opacity="0.9"/>

  <!-- Star 3 (Tiny Left Accent) -->
  <circle cx="48" cy="62" r="2" fill="#FFE57F" opacity="0.75"/>
</svg>
